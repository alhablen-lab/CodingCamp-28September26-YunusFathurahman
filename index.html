<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>Expense & Budget Visualizer</h1>
    <button id="theme-toggle">Dark Mode</button>
  </header>

  <main>

    <section id="form-section">
      <h2>Add Transaction</h2>

      <form id="transaction-form">

        <label for="name-input">Item Name</label>
        <input type="text" id="name-input">
        <span id="name-error"></span>

        <label for="amount-input">Amount</label>
        <input type="number" id="amount-input">
        <span id="amount-error"></span>

        <label for="category-select">Category</label>
        <select id="category-select">
          <option value="">Select Category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>
        <span id="category-error"></span>

        <button type="submit">Add Transaction</button>

      </form>
    </section>

    <section id="total-section">
      <h2>Total Spending</h2>

      <label for="sort-select">Sort By</label>
      <select id="sort-select">
        <option value="default">Default</option>
        <option value="amount-low">Amount: Low to High</option>
        <option value="amount-high">Amount: high to Low</option>
        <option value="category">Category: A-Z</option>
      </select>

      <p id="total-amount">Rp 0</p>

      <label for="limit-input">Spending Limit</label>
      <input type="number" id="limit-input" placeholder="Enter spending limit">

      <p id="limit-message"></p>
    </section>

    <section id="transaction-section">
      <h2>Transactions</h2>
      <ul id="transaction-list"></ul>
    </section>

    <section id="chart-section">
      <h2>Spending by Category</h2>
      <canvas id="expense-chart"></canvas>
      <p id="chart-placeholder">No transactions yet.</p>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/script.js"></script>

</body>

</html>
